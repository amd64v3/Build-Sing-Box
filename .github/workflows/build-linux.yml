name: Build & Release Linux Binary

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: "Source repository"
        required: true
        type: choice
        default: "Sing-Box Official"
        options:
          - "Sing-Box Official"
          - "Custom Repository"

      custom_repository:
        description: "Required only for Custom Repository (owner/repo)"
        required: false
        type: string
        default: ""

      upstream_ref:
        description: "Upstream Sing-Box ref (branch/tag/sha), e.g. master"
        required: true
        type: string
        default: "testing"

      version:
        description: "Release version string (no leading v), e.g. 1.14.0-beta.17"
        required: true
        type: string

      go_version:
        description: "Go version for actions/setup-go, e.g. 1.25.10"
        required: true
        type: string
        default: "1.26.6"

      pre_release:
        description: "Mark GitHub Release as pre-release"
        required: true
        type: boolean
        default: false

      build_tags:
        description: "Sing-Box build tags (comma-separated, no spaces), e.g. with_gvisor,with_quic"
        required: true
        type: string
        default: "with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,with_cloudflared,with_usbip,with_openvpn,with_openconnect,badlinkname,tfogo_checklinkname0,with_naive_outbound"

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            arch_label: amd64
            debian_arch: amd64
          - goarch: arm64
            arch_label: arm64
            debian_arch: arm64

    env:
      BUILD_TAGS: ${{ inputs.build_tags }}
      GO_VERSION: ${{ inputs.go_version }}

    outputs:
      upstream_sha: ${{ steps.meta.outputs.sha }}
      upstream_commit_date: ${{ steps.meta.outputs.commit_date }}
      build_ts: ${{ steps.meta.outputs.ts }}

    steps:
      - name: Validate manual inputs and resolve source
        shell: bash
        env:
          CUSTOM_REPOSITORY: ${{ inputs.custom_repository }}
        run: |
          set -euo pipefail

          check_required() {
            local name="$1"
            local value="$2"

            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "::error::Input '${name}' is required and cannot be empty."
              exit 1
            fi
          }

          check_required "upstream_ref" "${{ inputs.upstream_ref }}"
          check_required "version" "${{ inputs.version }}"
          check_required "go_version" "${{ inputs.go_version }}"
          check_required "build_tags" "${{ inputs.build_tags }}"

          if [[ "${{ inputs.source_repository }}" == "Sing-Box Official" ]]; then
            echo "UPSTREAM=SagerNet/sing-box" >> "$GITHUB_ENV"
            echo "SOURCE_TYPE=official" >> "$GITHUB_ENV"
          else
            custom_repository="${CUSTOM_REPOSITORY//[[:space:]]/}"

            if [[ -z "${custom_repository}" ]]; then
              echo "::error::Custom Repository is required when Source repository is set to Custom Repository."
              exit 1
            fi

            if [[ ! "${custom_repository}" =~ ^[^/[:space:]]+/[^/[:space:]]+$ ]]; then
              echo "::error::Custom Repository must use the owner/repo format."
              exit 1
            fi

            echo "UPSTREAM=${custom_repository}" >> "$GITHUB_ENV"
            echo "SOURCE_TYPE=custom" >> "$GITHUB_ENV"
          fi

          echo "Using source type=${{ inputs.source_repository }}"
          echo "Using upstream_ref=${{ inputs.upstream_ref }}"
          echo "Using version=${{ inputs.version }}"
          echo "Using go_version=${{ inputs.go_version }}"

      - name: Checkout sing-box source
        uses: actions/checkout@v5
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ inputs.upstream_ref }}
          path: sing-box
          fetch-depth: 0

      - name: Compute metadata
        id: meta
        working-directory: sing-box
        shell: bash
        run: |
          set -euo pipefail

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit_date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
          echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
          cache-dependency-path: sing-box/go.sum

      - name: Set local version tag
        working-directory: sing-box
        shell: bash
        run: |
          set -euo pipefail
          git tag "v${{ inputs.version }}" -f

      - name: Clone cronet-go
        working-directory: sing-box
        shell: bash
        run: |
          set -xeuo pipefail

          CRONET_GO_VERSION="$(cat .github/CRONET_GO_VERSION)"
          rm -rf "$HOME/cronet-go"
          git init "$HOME/cronet-go"
          git -C "$HOME/cronet-go" remote add origin https://github.com/sagernet/cronet-go.git
          git -C "$HOME/cronet-go" sparse-checkout set --no-cone '/*' '!/lib'
          git -C "$HOME/cronet-go" fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
          git -C "$HOME/cronet-go" checkout FETCH_HEAD
          git -C "$HOME/cronet-go" submodule update --init --recursive --depth=1

      - name: Regenerate Debian keyring
        shell: bash
        run: |
          set -xeuo pipefail

          rm -f "$HOME/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg"
          cd "$HOME/cronet-go"
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh

      - name: Set shared Linux build flags
        working-directory: sing-box
        shell: bash
        run: |
          set -euo pipefail

          RAW_BUILD_TAGS="${BUILD_TAGS// /}"

          IFS=',' read -ra TAG_ARRAY <<< "${RAW_BUILD_TAGS}"
          UNIQUE_TAGS=()

          for tag in "${TAG_ARRAY[@]}"; do
            [[ -z "${tag}" ]] && continue

            found=false
            for existing in "${UNIQUE_TAGS[@]}"; do
              if [[ "${existing}" == "${tag}" ]]; then
                found=true
                break
              fi
            done

            if [[ "${found}" == "false" ]]; then
              UNIQUE_TAGS+=("${tag}")
            fi
          done

          BASE_BUILD_TAGS="$(IFS=,; echo "${UNIQUE_TAGS[*]}")"
          LDFLAGS_SHARED="$(cat release/LDFLAGS)"

          echo "BASE_BUILD_TAGS=${BASE_BUILD_TAGS}" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=${LDFLAGS_SHARED}" >> "$GITHUB_ENV"

          echo "Using BASE_BUILD_TAGS=${BASE_BUILD_TAGS}"
          echo "Using LDFLAGS_SHARED=${LDFLAGS_SHARED}"
          echo "Using GO_VERSION=${GO_VERSION}"

      - name: Download Chromium glibc toolchain
        shell: bash
        run: |
          set -xeuo pipefail

          cd "$HOME/cronet-go"
          go run ./cmd/build-naive \
            --target=linux/${{ matrix.goarch }} \
            download-toolchain

      - name: Save Chromium glibc toolchain environment
        shell: bash
        run: |
          set -xeuo pipefail

          cd "$HOME/cronet-go"
          go run ./cmd/build-naive \
            --target=linux/${{ matrix.goarch }} \
            env > "$RUNNER_TEMP/cronet-glibc.env"

          cat "$RUNNER_TEMP/cronet-glibc.env"

      - name: Build Linux glibc binary (${{ matrix.goarch }})
        working-directory: sing-box
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -xeuo pipefail

          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            key="${line%%=*}"
            value="${line#*=}"
            export "${key}=${value}"
          done < "$RUNNER_TEMP/cronet-glibc.env"

          mkdir -p dist-glibc

          go build -v -trimpath \
            -o dist-glibc/sing-box \
            -tags "${BASE_BUILD_TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ inputs.version }}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box

          file dist-glibc/sing-box

      - name: Package glibc binary tar.gz
        working-directory: sing-box
        shell: bash
        run: |
          set -xeuo pipefail

          VERSION="${{ inputs.version }}"
          ARCH="${{ matrix.arch_label }}"
          DIR_NAME="sing-box-${VERSION}-linux-${ARCH}-glibc"

          mkdir -p "../dist/${DIR_NAME}"
          cp LICENSE "../dist/${DIR_NAME}/LICENSE"
          cp dist-glibc/sing-box "../dist/${DIR_NAME}/sing-box"

          pushd ../dist >/dev/null
          tar -czf "${DIR_NAME}.tar.gz" "${DIR_NAME}"
          rm -rf "${DIR_NAME}"
          popd >/dev/null

      - name: Download Chromium musl toolchain
        shell: bash
        run: |
          set -xeuo pipefail

          cd "$HOME/cronet-go"
          go run ./cmd/build-naive \
            --target=linux/${{ matrix.goarch }} \
            --libc=musl \
            download-toolchain

      - name: Save Chromium musl toolchain environment
        shell: bash
        run: |
          set -xeuo pipefail

          cd "$HOME/cronet-go"
          go run ./cmd/build-naive \
            --target=linux/${{ matrix.goarch }} \
            --libc=musl \
            env > "$RUNNER_TEMP/cronet-musl.env"

          cat "$RUNNER_TEMP/cronet-musl.env"

      - name: Build Linux musl binary (${{ matrix.goarch }})
        working-directory: sing-box
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -xeuo pipefail

          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            key="${line%%=*}"
            value="${line#*=}"
            export "${key}=${value}"
          done < "$RUNNER_TEMP/cronet-musl.env"

          MUSL_BUILD_TAGS="${BASE_BUILD_TAGS}"
          if [[ ",${MUSL_BUILD_TAGS}," != *",with_musl,"* ]]; then
            MUSL_BUILD_TAGS="${MUSL_BUILD_TAGS},with_musl"
          fi

          mkdir -p dist-musl

          go build -v -trimpath \
            -o dist-musl/sing-box \
            -tags "${MUSL_BUILD_TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ inputs.version }}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box

          file dist-musl/sing-box

      - name: Package musl binary tar.gz
        working-directory: sing-box
        shell: bash
        run: |
          set -xeuo pipefail

          VERSION="${{ inputs.version }}"
          ARCH="${{ matrix.arch_label }}"
          DIR_NAME="sing-box-${VERSION}-linux-${ARCH}-musl"

          mkdir -p "../dist/${DIR_NAME}"
          cp LICENSE "../dist/${DIR_NAME}/LICENSE"
          cp dist-musl/sing-box "../dist/${DIR_NAME}/sing-box"

          pushd ../dist >/dev/null
          tar -czf "${DIR_NAME}.tar.gz" "${DIR_NAME}"
          rm -rf "${DIR_NAME}"
          popd >/dev/null

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch_label }}
          path: |
            dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    concurrency:
      group: sing-box-release-${{ inputs.version }}
      cancel-in-progress: false

    env:
      RELEASE_TAG: v${{ inputs.version }}
      BUILD_TAGS: ${{ inputs.build_tags }}
      GO_VERSION: ${{ inputs.go_version }}
      PRE_RELEASE_KEEP: "10"
      FULL_RELEASE_KEEP: "5"

    steps:
      - name: Download Linux builds
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Set release flags
        id: flags
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ inputs.pre_release }}" == "true" ]]; then
            echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Linux release section
        shell: bash
        run: |
          set -euo pipefail

          RAW_BUILD_TAGS="${BUILD_TAGS// /}"

          IFS=',' read -ra TAG_ARRAY <<< "${RAW_BUILD_TAGS}"
          UNIQUE_TAGS=()

          for tag in "${TAG_ARRAY[@]}"; do
            [[ -z "${tag}" ]] && continue

            found=false
            for existing in "${UNIQUE_TAGS[@]}"; do
              if [[ "${existing}" == "${tag}" ]]; then
                found=true
                break
              fi
            done

            if [[ "${found}" == "false" ]]; then
              UNIQUE_TAGS+=("${tag}")
            fi
          done

          DISPLAY_TAGS="$(IFS=,; echo "${UNIQUE_TAGS[*]}")"

          {
            printf '<!-- BEGIN LINUX -->\n'
            printf 'Linux:\n\n'

            if [[ "${{ inputs.source_repository }}" == "Sing-Box Official" ]]; then
              printf 'Source: `official`\n'
              printf 'Upstream ref: `%s`\n' "${{ inputs.upstream_ref }}"
              printf 'Upstream commit: `%s`\n' "${{ needs.build.outputs.upstream_sha }}"
            else
              printf 'Source: `custom`\n'
            fi

            printf 'Go version: `%s`\n' "${GO_VERSION}"
            printf 'Tags: `%s`\n' "${DISPLAY_TAGS}"
            printf '\nNote:\n'
            printf 'musl variant is built with the additional tag `with_musl`.\n'
            printf '<!-- END LINUX -->\n'
          } > platform-section.md

          cat platform-section.md

      - name: Merge Android and Linux release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM: LINUX
        run: |
          set -euo pipefail

          if gh release view -R "${GITHUB_REPOSITORY}" "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release view -R "${GITHUB_REPOSITORY}" "${RELEASE_TAG}" \
              --json body --jq '.body' > existing-release-notes.txt
          else
            : > existing-release-notes.txt
          fi

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          body = Path("existing-release-notes.txt").read_text()
          new_section = Path("platform-section.md").read_text().strip()
          platform = os.environ["PLATFORM"]

          sections = {"ANDROID": "", "LINUX": ""}
          remaining = body

          for name in ("ANDROID", "LINUX"):
              pattern = re.compile(
                  rf"(?ms)^<!-- BEGIN {name} -->\n.*?^<!-- END {name} -->\s*"
              )
              match = pattern.search(remaining)
              if match:
                  sections[name] = match.group(0).strip()
              remaining = pattern.sub("", remaining)

          sections[platform] = new_section

          parts = []
          if remaining.strip():
              parts.append(remaining.strip())
          if sections["ANDROID"]:
              parts.append(sections["ANDROID"])
          if sections["LINUX"]:
              parts.append(sections["LINUX"])

          Path("release-notes.txt").write_text("\n\n".join(parts) + "\n")
          PY

          cat release-notes.txt

      - name: Ensure release tag has its own timestamped commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_COMMIT_DATE: ${{ needs.build.outputs.upstream_commit_date }}
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"

          if gh api "/repos/${owner}/${repo}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag exists: ${RELEASE_TAG}"
            exit 0
          fi

          default_branch="$(gh api "/repos/${owner}/${repo}" --jq '.default_branch')"
          base_sha="$(gh api "/repos/${owner}/${repo}/git/ref/heads/${default_branch}" --jq '.object.sha')"
          tree_sha="$(gh api "/repos/${owner}/${repo}/git/commits/${base_sha}" --jq '.tree.sha')"

          commit_payload="$(jq -nc \
            --arg message "Release metadata for ${RELEASE_TAG}" \
            --arg tree "${tree_sha}" \
            --arg parent "${base_sha}" \
            --arg date "${UPSTREAM_COMMIT_DATE}" \
            '{
              message: $message,
              tree: $tree,
              parents: [$parent],
              author: {
                name: "github-actions[bot]",
                email: "41898282+github-actions[bot]@users.noreply.github.com",
                date: $date
              },
              committer: {
                name: "github-actions[bot]",
                email: "41898282+github-actions[bot]@users.noreply.github.com",
                date: $date
              }
            }')"

          release_commit_sha="$(gh api -X POST \
            "/repos/${owner}/${repo}/git/commits" \
            --input - \
            --jq '.sha' <<<"${commit_payload}")"

          ref_payload="$(jq -nc \
            --arg ref "refs/tags/${RELEASE_TAG}" \
            --arg sha "${release_commit_sha}" \
            '{ref: $ref, sha: $sha}')"

          gh api -X POST \
            "/repos/${owner}/${repo}/git/refs" \
            --input - <<<"${ref_payload}" >/dev/null

          echo "Created ${RELEASE_TAG} -> ${release_commit_sha}"
          echo "Release sort timestamp: ${UPSTREAM_COMMIT_DATE}"

      - name: Ensure release exists (create if missing)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if gh release view -R "${GITHUB_REPOSITORY}" "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release exists: ${RELEASE_TAG}"
          else
            gh release create -R "${GITHUB_REPOSITORY}" "${RELEASE_TAG}" \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.txt \
              ${{ steps.flags.outputs.flag }}
          fi

      - name: Update release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh release edit -R "${GITHUB_REPOSITORY}" "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --notes-file release-notes.txt \
            ${{ steps.flags.outputs.flag }}

      - name: Upload Linux assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          assets=(dist/*.tar.gz dist/*.deb)

          if (( ${#assets[@]} == 0 )); then
            echo "::error::No Linux release assets found."
            exit 1
          fi

          gh release upload -R "${GITHUB_REPOSITORY}" "${RELEASE_TAG}" "${assets[@]}" --clobber

      - name: Delete workflow run artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          run_id="${GITHUB_RUN_ID}"

          artifacts="$(gh api -H "Accept: application/vnd.github+json" \
            "/repos/${owner}/${repo}/actions/runs/${run_id}/artifacts" \
            --jq '.artifacts[].id' || true)"

          if [[ -z "${artifacts}" ]]; then
            echo "No artifacts found for run ${run_id}"
            exit 0
          fi

          for id in ${artifacts}; do
            echo "Deleting artifact id=${id}"

            http_code="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' \
              --request DELETE \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${owner}/${repo}/actions/artifacts/${id}")"

            if [[ "${http_code}" != "204" ]]; then
              echo "::error::Failed to delete artifact id=${id} (HTTP ${http_code})"
              exit 1
            fi
          done

      - name: Cleanup old releases and tags
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "Release retention policy:"
          echo "  Pre-releases: keep ${PRE_RELEASE_KEEP}"
          echo "  Full releases: keep ${FULL_RELEASE_KEEP}"
          echo "  Draft releases: never delete"

          releases="$(
            gh release list \
              -R "${GITHUB_REPOSITORY}" \
              --limit 1000 \
              --json tagName,isPrerelease,isDraft,createdAt,publishedAt
          )"

          mapfile -t old_prereleases < <(
            jq -r \
              --argjson keep "${PRE_RELEASE_KEEP}" '
                [
                  .[]
                  | select(
                      .isDraft == false
                      and .isPrerelease == true
                    )
                ]
                | sort_by([.createdAt, .publishedAt, .tagName])
                | reverse
                | .[$keep:]
                | .[].tagName
              ' <<<"${releases}"
          )

          mapfile -t old_full_releases < <(
            jq -r \
              --argjson keep "${FULL_RELEASE_KEEP}" '
                [
                  .[]
                  | select(
                      .isDraft == false
                      and .isPrerelease == false
                    )
                ]
                | sort_by([.createdAt, .publishedAt, .tagName])
                | reverse
                | .[$keep:]
                | .[].tagName
              ' <<<"${releases}"
          )

          echo "Old pre-releases to delete: ${#old_prereleases[@]}"
          echo "Old full releases to delete: ${#old_full_releases[@]}"

          for tag in "${old_prereleases[@]}"; do
            echo "Deleting old pre-release and tag: ${tag}"
            gh release delete \
              -R "${GITHUB_REPOSITORY}" \
              "${tag}" \
              --cleanup-tag \
              --yes
          done

          for tag in "${old_full_releases[@]}"; do
            echo "Deleting old full release and tag: ${tag}"
            gh release delete \
              -R "${GITHUB_REPOSITORY}" \
              "${tag}" \
              --cleanup-tag \
              --yes
          done

          echo "Release cleanup completed."
