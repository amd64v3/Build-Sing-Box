name: Build & Release Android Binary

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: "Source repository"
        required: true
        type: choice
        default: "Sing-Box Official"
        options:
          - "Sing-Box Official"
          - "Custom Repository"

      custom_repository:
        description: "Required only for Custom Repository (owner/repo)"
        required: false
        type: string
        default: ""

      upstream_ref:
        description: "Upstream Sing-Box ref (branch/tag/sha), e.g. master"
        required: true
        type: string
        default: "testing"

      version:
        description: "Release version string (no leading v), e.g. 1.10.2-beta.15"
        required: true
        type: string

      go_version:
        description: "Go version for actions/setup-go, e.g. 1.25.10"
        required: true
        type: string
        default: "1.26.5"

      ndk_version:
        description: "Android NDK version, e.g. r28"
        required: true
        type: string
        default: "r28"

      pre_release:
        description: "Mark GitHub Release as pre-release"
        required: true
        type: boolean
        default: false

      build_tags:
        description: "Sing-Box build tags (comma-separated, no spaces), e.g. with_gvisor,with_quic"
        required: true
        type: string
        default: "with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,with_cloudflared,with_usbip,with_openvpn,with_openconnect,badlinkname,tfogo_checklinkname0,with_naive_outbound"

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: "386"
            arch_label: "386"
            ndk: i686-linux-android23
          - goarch: amd64
            arch_label: amd64
            ndk: x86_64-linux-android23
          - goarch: arm
            arch_label: arm
            ndk: armv7a-linux-androideabi23
          - goarch: arm64
            arch_label: arm64
            ndk: aarch64-linux-android23

    env:
      BUILD_TAGS: ${{ inputs.build_tags }}
      GO_VERSION: ${{ inputs.go_version }}
      NDK_VERSION: ${{ inputs.ndk_version }}

    outputs:
      upstream_sha: ${{ steps.meta.outputs.sha }}
      upstream_commit_date: ${{ steps.meta.outputs.commit_date }}
      build_ts: ${{ steps.meta.outputs.ts }}

    steps:
      - name: Validate manual inputs and resolve source
        shell: bash
        env:
          CUSTOM_REPOSITORY: ${{ inputs.custom_repository }}
        run: |
          set -euo pipefail

          check_required() {
            local name="$1"
            local value="$2"

            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "::error::Input '${name}' is required and cannot be empty."
              exit 1
            fi
          }

          check_required "upstream_ref" "${{ inputs.upstream_ref }}"
          check_required "version" "${{ inputs.version }}"
          check_required "go_version" "${{ inputs.go_version }}"
          check_required "ndk_version" "${{ inputs.ndk_version }}"
          check_required "build_tags" "${{ inputs.build_tags }}"

          if [[ "${{ inputs.source_repository }}" == "Sing-Box Official" ]]; then
            echo "UPSTREAM=SagerNet/sing-box" >> "$GITHUB_ENV"
            echo "SOURCE_TYPE=official" >> "$GITHUB_ENV"
          else
            custom_repository="${CUSTOM_REPOSITORY//[[:space:]]/}"

            if [[ -z "${custom_repository}" ]]; then
              echo "::error::Custom Repository is required when Source repository is set to Custom Repository."
              exit 1
            fi

            if [[ ! "${custom_repository}" =~ ^[^/[:space:]]+/[^/[:space:]]+$ ]]; then
              echo "::error::Custom Repository must use the owner/repo format."
              exit 1
            fi

            echo "UPSTREAM=${custom_repository}" >> "$GITHUB_ENV"
            echo "SOURCE_TYPE=custom" >> "$GITHUB_ENV"
          fi

          echo "Using source type=${{ inputs.source_repository }}"
          echo "Using upstream_ref=${{ inputs.upstream_ref }}"
          echo "Using version=${{ inputs.version }}"
          echo "Using go_version=${{ inputs.go_version }}"
          echo "Using ndk_version=${{ inputs.ndk_version }}"

      - name: Checkout sing-box source
        uses: actions/checkout@v5
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ inputs.upstream_ref }}
          path: sing-box
          fetch-depth: 0

      - name: Compute metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          cd sing-box
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit_date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
          echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
          cache-dependency-path: sing-box/go.sum

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          local-cache: false

      - name: Set Android NDK env
        shell: bash
        run: |
          set -euo pipefail

          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          NDK_BIN="${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "ANDROID_NDK_HOME=${NDK_PATH}" >> "$GITHUB_ENV"
          echo "NDK=${NDK_PATH}" >> "$GITHUB_ENV"
          echo "NDK_BIN=${NDK_BIN}" >> "$GITHUB_ENV"
          echo "${NDK_BIN}" >> "$GITHUB_PATH"

          echo "setup-ndk ndk-path=${NDK_PATH}"
          echo "NDK_BIN=${NDK_BIN}"

          "${NDK_BIN}/aarch64-linux-android23-clang" --version

      - name: Set upstream build flags
        working-directory: sing-box
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TAGS="${BUILD_TAGS// /}"
          LDFLAGS_SHARED="$(cat release/LDFLAGS)"

          echo "BUILD_TAGS=${BUILD_TAGS}" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=${LDFLAGS_SHARED}" >> "$GITHUB_ENV"

          echo "Using BUILD_TAGS=${BUILD_TAGS}"
          echo "Using LDFLAGS_SHARED=${LDFLAGS_SHARED}"
          echo "Using GO_VERSION=${GO_VERSION}"
          echo "Using NDK_VERSION=${NDK_VERSION}"

      - name: Build and package (android/${{ matrix.goarch }})
        working-directory: sing-box
        env:
          GOOS: android
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: |
          set -xeuo pipefail

          VERSION="${{ inputs.version }}"
          ARCH="${{ matrix.arch_label }}"
          PKG_NAME="sing-box-${VERSION}-android-${ARCH}"
          TAR_NAME="${PKG_NAME}.tar.gz"

          export CC="$NDK_BIN/${{ matrix.ndk }}-clang"
          export CXX="$NDK_BIN/${{ matrix.ndk }}-clang++"

          echo "Using CC=${CC}"
          "${CC}" --version

          mkdir -p "../dist/${PKG_NAME}"

          go build -v -trimpath \
            -o "../dist/${PKG_NAME}/sing-box" \
            -tags "${BUILD_TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box

          cp LICENSE "../dist/${PKG_NAME}/LICENSE"

          pushd ../dist >/dev/null
          tar -czf "${TAR_NAME}" "${PKG_NAME}"
          rm -rf "${PKG_NAME}"
          popd >/dev/null

      - name: Upload artifact (tar.gz)
        uses: actions/upload-artifact@v7
        with:
          name: android-tar-${{ matrix.arch_label }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: v${{ inputs.version }}
      BUILD_TAGS: ${{ inputs.build_tags }}
      GO_VERSION: ${{ inputs.go_version }}
      NDK_VERSION: ${{ inputs.ndk_version }}

    steps:
      - name: Download build tarballs
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Set release flags
        id: flags
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ inputs.pre_release }}" == "true" ]]; then
            echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update release notes file
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TAGS="${BUILD_TAGS// /}"

          if [[ "${{ inputs.source_repository }}" == "Sing-Box Official" ]]; then
            printf "Source: \`official\`\n" > release-notes.txt
            printf "Upstream ref: \`%s\`\n" "${{ inputs.upstream_ref }}" >> release-notes.txt
          else
            printf "Source: \`custom\`\n" > release-notes.txt
          fi

          printf "Upstream commit: \`%s\`\n" "${{ needs.build.outputs.upstream_sha }}" >> release-notes.txt
          printf "Go version: \`%s\`\n" "${GO_VERSION}" >> release-notes.txt
          printf "Android NDK version: \`%s\`\n" "${NDK_VERSION}" >> release-notes.txt
          printf "Tags: \`%s\`\n" "${BUILD_TAGS}" >> release-notes.txt

          cat release-notes.txt

      - name: Ensure release tag has its own timestamped commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_COMMIT_DATE: ${{ needs.build.outputs.upstream_commit_date }}
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"

          if gh api "/repos/${owner}/${repo}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag exists: ${RELEASE_TAG}"
            exit 0
          fi

          default_branch="$(gh api "/repos/${owner}/${repo}" --jq '.default_branch')"
          base_sha="$(gh api "/repos/${owner}/${repo}/git/ref/heads/${default_branch}" --jq '.object.sha')"
          tree_sha="$(gh api "/repos/${owner}/${repo}/git/commits/${base_sha}" --jq '.tree.sha')"

          commit_payload="$(jq -nc \
            --arg message "Release metadata for ${RELEASE_TAG}" \
            --arg tree "${tree_sha}" \
            --arg parent "${base_sha}" \
            --arg date "${UPSTREAM_COMMIT_DATE}" \
            '{
              message: $message,
              tree: $tree,
              parents: [$parent],
              author: {
                name: "github-actions[bot]",
                email: "41898282+github-actions[bot]@users.noreply.github.com",
                date: $date
              },
              committer: {
                name: "github-actions[bot]",
                email: "41898282+github-actions[bot]@users.noreply.github.com",
                date: $date
              }
            }')"

          release_commit_sha="$(gh api -X POST \
            "/repos/${owner}/${repo}/git/commits" \
            --input - \
            --jq '.sha' <<<"${commit_payload}")"

          ref_payload="$(jq -nc \
            --arg ref "refs/tags/${RELEASE_TAG}" \
            --arg sha "${release_commit_sha}" \
            '{ref: $ref, sha: $sha}')"

          gh api -X POST \
            "/repos/${owner}/${repo}/git/refs" \
            --input - <<<"${ref_payload}" >/dev/null

          echo "Created ${RELEASE_TAG} -> ${release_commit_sha}"
          echo "Release sort timestamp: ${UPSTREAM_COMMIT_DATE}"

      - name: Ensure release exists (create if missing)
        shell: bash
        run: |
          set -euo pipefail

          if gh release view -R "${GITHUB_REPOSITORY}" "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release exists: ${RELEASE_TAG}"
          else
            gh release create -R "${GITHUB_REPOSITORY}" "${RELEASE_TAG}" \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.txt \
              ${{ steps.flags.outputs.flag }}
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release notes
        shell: bash
        run: |
          set -euo pipefail

          gh release edit -R "${GITHUB_REPOSITORY}" "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --notes-file release-notes.txt \
            ${{ steps.flags.outputs.flag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload assets
        shell: bash
        run: |
          set -euo pipefail

          gh release upload -R "${GITHUB_REPOSITORY}" "${RELEASE_TAG}" dist/*.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete workflow run artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          run_id="${GITHUB_RUN_ID}"

          artifacts="$(gh api -H "Accept: application/vnd.github+json" \
            "/repos/${owner}/${repo}/actions/runs/${run_id}/artifacts" \
            --jq '.artifacts[].id' || true)"

          if [[ -z "${artifacts}" ]]; then
            echo "No artifacts found for run ${run_id}"
            exit 0
          fi

          for id in ${artifacts}; do
            echo "Deleting artifact id=${id}"

            http_code="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' \
              --request DELETE \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${owner}/${repo}/actions/artifacts/${id}")"

            if [[ "${http_code}" != "204" ]]; then
              echo "::error::Failed to delete artifact id=${id} (HTTP ${http_code})"
              exit 1
            fi
          done
