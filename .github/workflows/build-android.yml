name: Build & Release Android Binary

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream Sing-Box ref (branch/tag/sha), e.g. main"
        required: true
        type: string
        default: "testing"

      version:
        description: "Release version string (no leading v), e.g. 1.10.2-beta.15"
        required: true
        type: string

      go_version:
        description: "Go version for actions/setup-go, e.g. 1.25.10 or ~1.25.10"
        required: true
        type: string
        default: "~1.25.11"

      ndk_version:
        description: "Android NDK version, e.g. r28"
        required: true
        type: string
        default: "r28"

      pre_release:
        description: "Mark GitHub Release as pre-release"
        required: true
        type: boolean
        default: false

      build_tags:
        description: "Sing-Box build tags (comma-separated, no spaces), e.g. with_gvisor,with_quic"
        required: true
        type: string
        default: "with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,with_cloudflared,badlinkname,tfogo_checklinkname0,with_naive_outbound"

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: "386"
            arch_label: "386"
            ndk: i686-linux-android23
          - goarch: amd64
            arch_label: amd64
            ndk: x86_64-linux-android23
          - goarch: arm
            arch_label: arm
            ndk: armv7a-linux-androideabi23
          - goarch: arm64
            arch_label: arm64
            ndk: aarch64-linux-android23

    env:
      UPSTREAM: sagernet/sing-box
      BUILD_TAGS: ${{ inputs.build_tags }}
      GO_VERSION: ${{ inputs.go_version }}
      NDK_VERSION: ${{ inputs.ndk_version }}

    outputs:
      upstream_sha: ${{ steps.meta.outputs.sha }}
      build_ts: ${{ steps.meta.outputs.ts }}

    steps:
      - name: Validate manual inputs
        shell: bash
        run: |
          set -euo pipefail

          check_required() {
            local name="$1"
            local value="$2"

            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "::error::Input '${name}' is required and cannot be empty."
              exit 1
            fi
          }

          check_required "upstream_ref" "${{ inputs.upstream_ref }}"
          check_required "version" "${{ inputs.version }}"
          check_required "go_version" "${{ inputs.go_version }}"
          check_required "ndk_version" "${{ inputs.ndk_version }}"
          check_required "build_tags" "${{ inputs.build_tags }}"

          echo "Using upstream_ref=${{ inputs.upstream_ref }}"
          echo "Using version=${{ inputs.version }}"
          echo "Using go_version=${{ inputs.go_version }}"
          echo "Using ndk_version=${{ inputs.ndk_version }}"

      - name: Checkout sing-box source
        uses: actions/checkout@v5
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ inputs.upstream_ref }}
          path: sing-box
          fetch-depth: 0

      - name: Compute metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          cd sing-box
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
          cache-dependency-path: sing-box/go.sum

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          local-cache: false

      - name: Set NDK env
        shell: bash
        run: |
          set -euo pipefail
          echo "NDK_BIN=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"

      - name: Build and package (android/${{ matrix.goarch }})
        working-directory: sing-box
        env:
          GOOS: android
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: |
          set -xeuo pipefail

          # Optional: strip spaces if user pasted tags with spaces
          BUILD_TAGS="${BUILD_TAGS// /}"
          echo "Using BUILD_TAGS=${BUILD_TAGS}"
          echo "Using GO_VERSION=${GO_VERSION}"
          echo "Using NDK_VERSION=${NDK_VERSION}"

          export CC="$NDK_BIN/${{ matrix.ndk }}-clang"
          export CXX="$NDK_BIN/${{ matrix.ndk }}-clang++"

          VERSION="${{ inputs.version }}"
          ARCH="${{ matrix.arch_label }}"
          PKG_NAME="sing-box-${VERSION}-android-${ARCH}"
          TAR_NAME="${PKG_NAME}.tar.gz"

          mkdir -p "../dist/${PKG_NAME}"

          go build -v -trimpath \
            -o "../dist/${PKG_NAME}/sing-box" \
            -tags "${BUILD_TAGS}" \
            -ldflags "-s -buildid= -X github.com/sagernet/sing-box/constant.Version=${VERSION} -X internal/godebug.defaultGODEBUG=multipathtcp=0 -checklinkname=0" \
            ./cmd/sing-box

          cp LICENSE "../dist/${PKG_NAME}/LICENSE"

          pushd ../dist >/dev/null
          tar -czf "${TAR_NAME}" "${PKG_NAME}"
          rm -rf "${PKG_NAME}"
          popd >/dev/null

      - name: Upload artifact (tar.gz)
        uses: actions/upload-artifact@v7
        with:
          name: android-tar-${{ matrix.arch_label }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: v${{ inputs.version }}
      BUILD_TAGS: ${{ inputs.build_tags }}
      GO_VERSION: ${{ inputs.go_version }}
      NDK_VERSION: ${{ inputs.ndk_version }}

    steps:
      - name: Download build tarballs
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Set release flags
        id: flags
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ inputs.pre_release }}" == "true" ]]; then
            echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update release notes file
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TAGS="${BUILD_TAGS// /}"

          printf "Upstream ref: \`%s\`\n" "${{ inputs.upstream_ref }}" > release-notes.txt
          printf "Upstream commit: \`%s\`\n" "${{ needs.build.outputs.upstream_sha }}" >> release-notes.txt
          printf "Go version: \`%s\`\n" "${GO_VERSION}" >> release-notes.txt
          printf "Android NDK version: \`%s\`\n" "${NDK_VERSION}" >> release-notes.txt
          printf "Tags: \`%s\`\n" "${BUILD_TAGS}" >> release-notes.txt

          cat release-notes.txt

      - name: Ensure release exists (create if missing)
        shell: bash
        run: |
          set -euo pipefail

          if gh release view -R "${GITHUB_REPOSITORY}" "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release exists: ${RELEASE_TAG}"
          else
            gh release create -R "${GITHUB_REPOSITORY}" "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.txt \
              ${{ steps.flags.outputs.flag }}
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release notes
        shell: bash
        run: |
          set -euo pipefail

          gh release edit -R "${GITHUB_REPOSITORY}" "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --notes-file release-notes.txt \
            ${{ steps.flags.outputs.flag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload assets
        shell: bash
        run: |
          set -euo pipefail

          gh release upload -R "${GITHUB_REPOSITORY}" "${RELEASE_TAG}" dist/*.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete workflow run artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          run_id="${GITHUB_RUN_ID}"

          artifacts="$(gh api -H "Accept: application/vnd.github+json" \
            "/repos/${owner}/${repo}/actions/runs/${run_id}/artifacts" \
            --jq '.artifacts[].id' || true)"

          if [[ -z "${artifacts}" ]]; then
            echo "No artifacts found for run ${run_id}"
            exit 0
          fi

          for id in ${artifacts}; do
            echo "Deleting artifact id=${id}"
            gh api -X DELETE -H "Accept: application/vnd.github+json" \
              "/repos/${owner}/${repo}/actions/artifacts/${id}"
          done
